name: CI

# Quality gate on every push and every pull request.
# Release workflows never run if this one is red.

# No bare push trigger: PRs cover feature branches, and on main CI runs as the
# release gate via workflow_call from 02-tag-sync.yml (which fires on every push to
# main). This keeps exactly one CI run per change — no double-runs.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'bin/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/01-ci.yml'
  workflow_call: # called by 02-tag-sync.yml as the release gate
  workflow_dispatch:

permissions:
  contents: read # minimum for checkout in 00-install-deps nested job

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs; never cancel a run on main (it may be releasing).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install-deps:
    name: Install dependencies
    uses: ./.github/workflows/00-install-deps.yml

  quality:
    name: Lint & Format
    needs: [install-deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11'
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24.16.0'
          cache: pnpm # cache hit from install job — no network download
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec prettier --check .

  test:
    name: Tests (Node ${{ matrix.node }})
    needs: [install-deps] # parallel with quality — no gate between them
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['24.16.0', '24']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11'
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '${{ matrix.node }}'
          cache: pnpm # cache hit from install job — no network download
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Coverage (threshold check)
        if: matrix.node == '24.16.0'
        run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: matrix.node == '24.16.0' && always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
