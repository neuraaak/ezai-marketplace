name: 01 · CI

# Quality gate on every push and every pull request.
# Release workflows never run if this one is red.

# No bare push trigger: PRs cover feature branches, and on main CI runs as the
# release gate via workflow_call from 02-tag-sync.yml (which fires on every push to
# main). This keeps exactly one CI run per change — no double-runs.
on:
  pull_request: # no paths filter: prettier/build-index cover the whole tree
  workflow_call: # called by 02-tag-sync.yml as the release gate
  workflow_dispatch:

permissions:
  contents: read # minimum for checkout in 00-install-deps nested job

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs; never cancel a run on main (it may be releasing).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Two consumers only (quality, test): no type-check job in a plain-JS repo,
  # and `security` audits the lockfile without installing. The ~3-consumer
  # heuristic would drop this primer; it is kept on purpose, so this chain
  # reads identically to the Python repos that share the 00-04 architecture.
  install-deps:
    name: Install & cache deps
    uses: ./.github/workflows/00-install-deps.yml

  quality:
    name: Lint & format
    needs: [install-deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11'
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24.16.0'
          cache: pnpm # cache hit from install job — no network download
      - run: pnpm install --frozen-lockfile
      # eslint-plugin-security runs inside this step: for JS the SAST *is* the
      # linter, so there is no separate command to give the security job.
      - run: pnpm lint
      - run: pnpm format:check
      - name: Verify catalogue is up to date
        run: |
          pnpm build-index
          git diff --exit-code .claude-plugin/marketplace.json

  security:
    name: Security scan
    # No install and no primer: `pnpm audit` reads the lockfile, not node_modules.
    # Separate from `quality` so an upstream advisory reddens its own job instead
    # of the deterministic gate — and never gates the tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11'
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24.16.0'
      # Runtime dependencies only: dev-tree advisories with no upstream fix
      # would block every PR without making the shipped CLI any safer.
      - run: pnpm audit --audit-level high --prod

  test:
    name: Tests
    needs: [install-deps] # parallel with quality — no gate between them
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11'
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24.16.0'
          cache: pnpm # cache hit from install job — no network download
      - run: pnpm install --frozen-lockfile
      # test:coverage runs the full suite + the >=70% threshold gate in one pass.
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
