name: Auto Tag

# On every push to main: read version from package.json, create a vX.Y.Z tag
# (and a vX-latest moving tag), then cascade to publish and docs if the version
# is new. If the tag already exists at HEAD, nothing happens. If the tag exists
# but points at a different commit (chore/docs push without a version bump), the
# tags are moved to HEAD without triggering publish — unless the old tag was on a
# feature branch, in which case publish is triggered (version was never released
# from main).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-tag:
    name: Create and Push Tags
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag_action: ${{ steps.create_tags.outputs.tag_action }}
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.create_tags.outputs.tag_name }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ]; then
            echo "::error::No version found in package.json"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create and push tags
        id: create_tags
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG_NAME="v$VERSION"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          LATEST_TAG="v${MAJOR}-latest"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "$TAG_NAME")
            HEAD_SHA=$(git rev-parse HEAD)
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "tag_action=none" >> $GITHUB_OUTPUT
              echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
              echo "Tag $TAG_NAME already points to HEAD — nothing to do"
            else
              git tag -f "$TAG_NAME"
              git tag -f "$LATEST_TAG"
              git push origin --force "$TAG_NAME"
              git push origin --force "$LATEST_TAG"
              # If the old tag was already on main (docs/chore commit on main after a
              # publish), the version was already released — skip publish.
              # If the old tag was on a feature branch (tagged before merging), it was
              # never published from main — trigger publish now.
              if git merge-base --is-ancestor "$TAG_SHA" "HEAD^1" 2>/dev/null; then
                echo "tag_action=update" >> $GITHUB_OUTPUT
                echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
                echo "🔄 Tags moved to HEAD: $TAG_NAME, $LATEST_TAG (no publish — already released from main)"
              else
                echo "tag_action=create" >> $GITHUB_OUTPUT
                echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
                echo "🔄 Tags moved to HEAD: $TAG_NAME, $LATEST_TAG (publish — tag was on feature branch)"
              fi
            fi
          else
            git tag "$TAG_NAME"
            git tag -f "$LATEST_TAG"
            git push origin "$TAG_NAME"
            git push origin --force "$LATEST_TAG"
            echo "tag_action=create" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "✅ Tags pushed: $TAG_NAME, $LATEST_TAG"
          fi

      - name: Summary
        if: steps.create_tags.outputs.tag_action != 'none'
        run: |
          echo "## 🏷️ Auto-Tagging Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Action**: ${{ steps.create_tags.outputs.tag_action }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: ${{ steps.create_tags.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY

  trigger-publish:
    name: Trigger Publish
    needs: auto-tag
    if: needs.auto-tag.outputs.tag_action == 'create'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm.yml
    with:
      version: ${{ needs.auto-tag.outputs.version }}
      tag: ${{ needs.auto-tag.outputs.tag_name }}

  trigger-deploy-docs:
    name: Trigger Deploy Docs
    needs: [auto-tag, trigger-publish]
    if: |
      always() &&
      needs.auto-tag.result == 'success' &&
      needs.auto-tag.outputs.tag_action != 'none' &&
      (needs.trigger-publish.result == 'success' || needs.trigger-publish.result == 'skipped')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      version: ${{ needs.auto-tag.outputs.version }}
