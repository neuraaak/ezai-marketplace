name: Deploy docs

# Called by 02-tag-sync.yml with tag_action = create | skip | preview.
# Also triggered on pull_request for validation builds (never deploys on PR).
#
#   create  → build + mike deploy vX.Y.Z --update-aliases latest  (versioned release)
#   skip    → build + mike deploy dev                              (main between releases)
#   preview → build only, mike deploy without --push               (pipeline check, no gh-pages push)
#   PR      → build only, no deploy

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'cliff.toml'
  workflow_dispatch:
  workflow_call: # on release/skip: called by 02-tag-sync after publish
    inputs:
      version:
        required: false
        type: string
      tag_action:
        description: 'create | skip | preview'
        required: false
        type: string
        default: 'preview'

permissions:
  contents: read # minimum for checkout in 00-install-deps nested job

jobs:
  install-deps:
    name: Install dependencies
    uses: ./.github/workflows/00-install-deps.yml

  build:
    needs: [install-deps]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history for lastUpdated and git-cliff

      - name: Generate changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          config: cliff.toml
          args: --output docs/changelog.md

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11'
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24.16.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild es5-ext vue-demi # native binaries needed by vitepress + versioning plugin
      - run: pnpm run docs:build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    # PRs only validate the build — never deploy.
    # On workflow_call the tag_action input drives the deploy mode.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # mike pushes to gh-pages
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false # never interrupt a live Pages deploy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true

      - name: Setup Python + mike
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: 'pip install mike==2.1.3 --only-binary :all:'

      - name: Deploy docs (create — versioned release)
        if: inputs.tag_action == 'create'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default --push latest

      - name: Deploy docs (skip — dev alias for main between releases)
        if: inputs.tag_action == 'skip'
        run: mike deploy --push dev

      - name: Deploy docs (preview — local build check, no push)
        if: inputs.tag_action == 'preview' || inputs.tag_action == ''
        run: mike deploy dev # no --push: validates mike config without touching gh-pages

      - id: deployment
        if: inputs.tag_action == 'create' || inputs.tag_action == 'skip'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
