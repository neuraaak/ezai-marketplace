name: Publish to npm

# Called by 02-tag-sync.yml with tag_action = create | preview.
# Never called on skip (no publish when version is unchanged).
#
#   create  → validate + upload to npm (OIDC, no stored token)
#   preview → validate + pack only, no upload (pipeline resilience check)
#
# Manual workflow_dispatch always behaves like 'create' (full publish).
# Requires an npm Trusted Publisher configured at:
# https://www.npmjs.com/settings/<org>/packages → ezai-marketplace → Publishing

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests before publishing (not recommended)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      tag_action:
        description: 'create | preview — controls whether the package is actually uploaded'
        required: true
        type: string

permissions:
  contents: read # minimum for checkout in 00-install-deps nested job

concurrency:
  group: publish
  cancel-in-progress: false # never interrupt a live publish

env:
  PACKAGE_NAME: ezai-marketplace

jobs:
  install-deps:
    name: Install dependencies
    uses: ./.github/workflows/00-install-deps.yml

  validate:
    name: Validate & Pack
    needs: [install-deps]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Extract and verify version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: input=$INPUT_VERSION, package.json=$PKG_VERSION"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $PKG_VERSION"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11'
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24.16.0'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - name: Run tests
        if: github.event.inputs.skip_tests != 'true'
        run: pnpm test

      - name: Dry-run pack (verify publishable files)
        run: npm pack --dry-run

  publish:
    name: Publish to npm (OIDC)
    needs: validate
    # preview = build/pack only; upload only on create or manual dispatch
    if: inputs.tag_action == 'create' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # mint OIDC token for npm Trusted Publishing
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ env.PACKAGE_NAME }}/v/${{ needs.validate.outputs.version }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24.16.0'
          registry-url: 'https://registry.npmjs.org'

      # Re-run safe: treat "version already published" as success so a replayed
      # release doesn't 409. (golden rule #4 — replay-safe delivery)
      - name: Check if version already published
        id: published
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PACKAGE_NAME}@${VERSION} already on npm — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.published.outputs.exists == 'false'
        run: npm publish --provenance --access public --ignore-scripts

      - name: Summary
        run: |
          echo "## Published to npm" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: ${{ env.PACKAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://www.npmjs.com/package/${{ env.PACKAGE_NAME }}/v/${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
