name: 03 · Publish

# Called by 02-tag-sync.yml with tag_action = create | preview.
# Never called on skip (no publish when version is unchanged).
#
#   create  → validate + upload to npm (OIDC, no stored token)
#   preview → validate + publish --dry-run, no upload (pipeline resilience check)
#
# Gating is keyed on the `tag_action` INPUT, never on github.event_name: in a
# reusable workflow the event is inherited from the caller (`push`), so an
# `event_name == 'workflow_dispatch'` escape hatch would let a manual run from
# an arbitrary ref fire the irreversible npm upload. A manual dispatch therefore
# defaults to `preview` and must opt in to `create` explicitly.
#
# Requires an npm Trusted Publisher configured at:
# https://www.npmjs.com/settings/<org>/packages → ezai-marketplace → Publishing

on:
  workflow_dispatch:
    inputs:
      tag_action:
        description: 'create = upload to npm (irreversible) | preview = build + pack only'
        required: true
        type: choice
        default: preview
        options:
          - preview
          - create
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag_action:
        description: 'create | preview — controls whether the package is actually uploaded'
        required: false
        type: string
        default: preview

permissions: {} # each job grants its own

concurrency:
  group: publish
  cancel-in-progress: false # never interrupt a live publish

env:
  PACKAGE_NAME: ezai-marketplace

jobs:
  # No 00-install-deps primer: `validate` is the only job that installs
  # (`publish` just downloads the artifact), so the primer would be a serial
  # job warming a cache its single consumer warms itself.
  validate:
    name: Validate & build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch: input=$INPUT_VERSION, package.json=$PKG_VERSION"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $PKG_VERSION"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lint and tests already ran on this exact commit: 02-tag-sync gates the
      # cascade on 01-ci before calling this workflow. They are re-run only for
      # a direct workflow_dispatch, which has no upstream gate — and
      # `github.event_name` is the right signal here precisely because a
      # workflow_call inherits the caller's event (`push`), never
      # 'workflow_dispatch'.
      - if: github.event_name == 'workflow_dispatch'
        run: pnpm lint

      - if: github.event_name == 'workflow_dispatch'
        run: pnpm lint:security

      - if: github.event_name == 'workflow_dispatch'
        run: pnpm test:coverage

      # Replays the full publish path (manifest, files, registry validation)
      # without uploading. No OIDC/auth needed → preview stays out of the
      # protected 'npm' environment. Mirrors the real publish step minus
      # --provenance (which requires an id-token) and the upload itself.
      - name: Dry-run publish
        run: npm publish --dry-run --access public --ignore-scripts

      # The `files` field decides what ships; a typo there would publish a
      # package whose bin entry point is missing. Check the real tarball.
      - name: Verify package contents
        run: |
          npm pack --ignore-scripts >/dev/null
          TARBALL=$(ls ./*.tgz | head -1)
          for entry in package/bin/ezai.js package/src/catalogue.js package/.claude-plugin/marketplace.json; do
            tar -tzf "$TARBALL" | grep -qx "$entry" || {
              echo "::error::Missing from published tarball: $entry"; exit 1; }
          done
          echo "Tarball integrity check passed"

  publish:
    name: Publish (npm)
    needs: validate
    # preview = build/pack only; the upload needs an explicit `create`.
    if: inputs.tag_action == 'create'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # mint OIDC token for npm Trusted Publishing
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ env.PACKAGE_NAME }}/v/${{ needs.validate.outputs.version }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      # Re-run safe: treat "version already published" as success so a replayed
      # release doesn't 409. (golden rule #4 — replay-safe delivery)
      - name: Verify version is new
        id: published
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PACKAGE_NAME}@${VERSION} already on npm — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (OIDC)
        if: steps.published.outputs.exists == 'false'
        run: npm publish --provenance --access public --ignore-scripts

      - name: Summary
        run: |
          echo "## Published to npm" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: ${{ env.PACKAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://www.npmjs.com/package/${{ env.PACKAGE_NAME }}/v/${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
