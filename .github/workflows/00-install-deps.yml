name: Install dependencies

# Reusable workflow: primes the pnpm store cache (keyed on pnpm-lock.yaml) so
# every caller gets a fast cache-hit install instead of a full network download.
# Called by 01-ci.yml; the warm cache is then available to 03 and 04 which run
# after CI completes (same repo, same cache key).

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        required: false
        type: string
        default: '24.16.0'

permissions: {}

jobs:
  install:
    name: Install & cache deps
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11'
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm # keys on pnpm-lock.yaml hash — shared across all workflows in this repo
      - run: pnpm install --frozen-lockfile
