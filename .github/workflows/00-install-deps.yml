name: 00 · Install Deps

# Reusable workflow: primes the pnpm store cache (keyed on pnpm-lock.yaml) so
# every caller gets a fast cache-hit install instead of a full network download.
# Called by 01-ci.yml; the warm cache is then available to 03 and 04 which run
# after CI completes (same repo, same cache key).

on:
  workflow_call:

permissions: {}

jobs:
  install:
    name: Install & cache deps
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm # keys on pnpm-lock.yaml hash — shared across all workflows in this repo
      - run: pnpm install --frozen-lockfile
